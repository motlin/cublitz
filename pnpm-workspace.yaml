onlyBuiltDependencies:
  - esbuild
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.4
  vite-plus: 1.1.0
  # Must match the vitest that vite-plus bundles, not the catalog vitest above.
  "@vitest/coverage-v8": 5.0.3
overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # Older postcss reads arbitrary .map files from an attacker-controlled sourceMappingURL (GHSA-6g55-p6wh-862q).
  postcss: ">=8.5.23"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
  fallow: true
  sharp: false
  workerd: true

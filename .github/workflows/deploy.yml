# Publishes dist/ to Cloudflare Pages on push to main, once the checks pass.
name: Deploy

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just check
      - run: just test
      - run: just install
      - run: pnpm exec playwright install --with-deps chromium
      - run: just test-browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing is cached in a job that holds the Cloudflare credentials.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # `--branch main` is what makes this the production deployment rather than a preview.
      - name: Deploy to Pages
        run: node_modules/.bin/wrangler pages deploy --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
